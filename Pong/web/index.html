  :root {
    --wall: #ede6d8;
    --wall-shadow: #ddd3bf;
    --ink: #2a241c;
    --ink-soft: #6b5f4e;
    --court-red: #b23a2e;
    --wood: #a9784f;
    --wood-deep: #7d5a3a;
    --line: rgba(42, 36, 28, 0.14);
    --card-shadow: 0 30px 60px -25px rgba(42, 36, 28, 0.35);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --wall: #1b1712;
    --wall-shadow: #120f0b;
    --ink: #f1e9dc;
    --ink-soft: #b8a98f;
    --court-red: #e2543f;
    --wood: #c9985f;
    --wood-deep: #8a6535;
    --line: rgba(241, 233, 220, 0.14);
    --card-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --wall: #1b1712;
      --wall-shadow: #120f0b;
      --ink: #f1e9dc;
      --ink-soft: #b8a98f;
      --court-red: #e2543f;
      --wood: #c9985f;
      --wood-deep: #8a6535;
      --line: rgba(241, 233, 220, 0.14);
      --card-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.65);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--wall-shadow);
    color: var(--ink);
    font-family: 'Lora', ui-serif, Georgia, serif;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(16px, 4vw, 48px) 16px 64px;
  }

  .court {
    width: min(480px, 100%);
    background: var(--wall);
    border-radius: 18px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
    position: relative;
  }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 22px 22px 14px;
    border-bottom: 1px solid var(--line);
  }
  .masthead h1 {
    margin: 0;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 5vw, 26px);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .masthead .subtitle {
    display: block;
    font-family: 'Lora', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    margin-top: 2px;
  }

  .scoreboard {
    display: flex;
    gap: 22px;
    padding: 14px 22px;
  }
  .scoreboard .cell {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .scoreboard .label {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .scoreboard .value {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .scoreboard .value.accent { color: var(--court-red); }

  .field {
    position: relative;
    margin: 0 14px 14px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: var(--wall);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: linear-gradient(180deg, transparent, var(--wall) 78%);
  }
  .overlay[hidden] { display: none; }
  .overlay h2 {
    margin: 0;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 22px;
  }
  .overlay p {
    margin: 0;
    color: var(--ink-soft);
    font-style: italic;
    max-width: 30ch;
  }
  .overlay button {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 14px;
    border: none;
    cursor: pointer;
    background: var(--court-red);
    color: var(--wall);
    padding: 12px 28px;
    border-radius: 999px;
    transition: transform 0.15s ease;
  }
  .overlay button:hover { transform: translateY(-1px); }
  .overlay button:focus-visible {
    outline: 3px solid var(--wood);
    outline-offset: 2px;
  }

  .signage {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 22px 20px;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .keys {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    font-family: 'Oswald', sans-serif;
  }
  kbd {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--line);
    border-bottom-width: 3px;
    border-radius: 6px;
    padding: 3px 9px;
    background: var(--wall-shadow);
    color: var(--ink);
  }

  .touch-controls {
    display: none;
    gap: 10px;
    padding: 0 22px 22px;
  }
  .touch-controls button {
    flex: 1;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--wood);
    color: #241a0f;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 18px;
    cursor: pointer;
  }
  @media (hover: none) and (pointer: coarse) {
    .touch-controls { display: flex; }
  }
</style>

<main class="court">
  <header class="masthead">
    <div>
      <h1>Squash solo</h1>
      <span class="subtitle">pong contre un mur — une raquette, un mur, un jeu</span>
    </div>
  </header>

  <div class="scoreboard">
    <div class="cell">
      <span class="label">Score</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="cell">
      <span class="label">Meilleur</span>
      <span class="value accent" id="best">0</span>
    </div>
  </div>

  <div class="field">
    <canvas id="game" width="440" height="620" aria-label="Aire de jeu du squash solo"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Prêt à jouer&nbsp;?</h2>
      <p id="overlay-text">La balle rebondit sur le mur du fond et les côtés. Renvoie-la avec ta raquette avant qu'elle ne touche le sol.</p>
      <button id="start-btn" type="button">Jouer</button>
    </div>
  </div>

  <p class="signage">
    <span class="keys">Déplacer la raquette&nbsp;: <kbd>&larr;</kbd> <kbd>&rarr;</kbd></span>
  </p>

  <div class="touch-controls">
    <button id="left-btn" type="button" aria-label="Déplacer la raquette à gauche">&larr;</button>
    <button id="right-btn" type="button" aria-label="Déplacer la raquette à droite">&rarr;</button>
  </div>
</main>

<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlay-title');
  var overlayText = document.getElementById('overlay-text');
  var startBtn = document.getElementById('start-btn');
  var leftBtn = document.getElementById('left-btn');
  var rightBtn = document.getElementById('right-btn');

  var W = canvas.width, H = canvas.height;
  var WALL_H = 10;
  var PADDLE_W = 92, PADDLE_H = 16, PADDLE_Y = H - 40;
  var BALL_R = 9;
  var MAX_SPEED = 640;

  var state = {
    running: false,
    paddleX: W / 2,
    ballX: W / 2,
    ballY: H / 2,
    vx: 190,
    vy: -230,
    score: 0,
    best: Number(localStorage.getItem('squashSolo.best') || 0),
    leftHeld: false,
    rightHeld: false
  };

  bestEl.textContent = state.best;

  function isDark() {
    return getComputedStyle(document.documentElement).colorScheme === 'dark';
  }

  function draw() {
    var styles = getComputedStyle(document.documentElement);
    var wall = styles.getPropertyValue('--wall').trim();
    var ink = styles.getPropertyValue('--ink').trim();
    var red = styles.getPropertyValue('--court-red').trim();
    var wood = styles.getPropertyValue('--wood').trim();
    var woodDeep = styles.getPropertyValue('--wood-deep').trim();

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = wall;
    ctx.fillRect(0, 0, W, H);

    // back wall out-line
    ctx.fillStyle = red;
    ctx.fillRect(0, 0, W, WALL_H);

    // service line (mid-court, purely decorative court marking)
    ctx.strokeStyle = red;
    ctx.globalAlpha = 0.45;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(0, H * 0.42);
    ctx.lineTo(W, H * 0.42);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    // paddle (racket)
    var px = state.paddleX - PADDLE_W / 2;
    ctx.fillStyle = wood;
    roundRect(ctx, px, PADDLE_Y, PADDLE_W, PADDLE_H, 6);
    ctx.fill();
    ctx.fillStyle = woodDeep;
    ctx.fillRect(state.paddleX - 3, PADDLE_Y + PADDLE_H - 2, 6, 10);

    // ball
    ctx.beginPath();
    ctx.fillStyle = ink;
    ctx.arc(state.ballX, state.ballY, BALL_R, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function resetBall() {
    state.ballX = W / 2;
    state.ballY = H / 2;
    state.vx = 190 * (Math.random() < 0.5 ? -1 : 1);
    state.vy = -230;
    state.score = 0;
    scoreEl.textContent = '0';
  }

  function startGame() {
    resetBall();
    state.paddleX = W / 2;
    state.running = true;
    overlay.setAttribute('hidden', '');
  }

  function endGame() {
    state.running = false;
    if (state.score > state.best) {
      state.best = state.score;
      localStorage.setItem('squashSolo.best', String(state.best));
      bestEl.textContent = state.best;
    }
    overlayTitle.textContent = 'Perdu !';
    overlayText.textContent = 'Score : ' + state.score + '. La balle a touché le sol.';
    startBtn.textContent = 'Rejouer';
    overlay.removeAttribute('hidden');
  }

  var PADDLE_SPEED = 480; // px/s while a key or button is held

  var last = null;
  function tick(ts) {
    if (last === null) last = ts;
    var dt = Math.min(0.032, (ts - last) / 1000);
    last = ts;

    if (state.running) {
      if (state.leftHeld) state.paddleX -= PADDLE_SPEED * dt;
      if (state.rightHeld) state.paddleX += PADDLE_SPEED * dt;
      state.paddleX = Math.max(PADDLE_W / 2, Math.min(W - PADDLE_W / 2, state.paddleX));

      var nx = state.ballX + state.vx * dt;
      var ny = state.ballY + state.vy * dt;

      if (nx - BALL_R <= 0) { nx = BALL_R; state.vx = Math.abs(state.vx); }
      else if (nx + BALL_R >= W) { nx = W - BALL_R; state.vx = -Math.abs(state.vx); }

      if (ny - BALL_R <= WALL_H) { ny = BALL_R + WALL_H; state.vy = Math.abs(state.vy); }

      var halfPaddle = PADDLE_W / 2;
      if (state.vy > 0 &&
          ny + BALL_R >= PADDLE_Y &&
          ny + BALL_R <= PADDLE_Y + PADDLE_H + 10 &&
          nx >= state.paddleX - halfPaddle &&
          nx <= state.paddleX + halfPaddle) {
        ny = PADDLE_Y - BALL_R;
        var offset = (nx - state.paddleX) / halfPaddle;
        var speed = Math.min(MAX_SPEED, Math.hypot(state.vx, state.vy) * 1.05);
        var angle = offset * (Math.PI / 3);
        state.vx = speed * Math.sin(angle);
        state.vy = -Math.abs(speed * Math.cos(angle));
        state.score += 1;
        scoreEl.textContent = String(state.score);
        if (state.score > state.best) {
          state.best = state.score;
          localStorage.setItem('squashSolo.best', String(state.best));
          bestEl.textContent = state.best;
        }
      }

      if (ny - BALL_R > H) {
        endGame();
      } else {
        state.ballX = nx;
        state.ballY = ny;
      }
    }

    draw();
    requestAnimationFrame(tick);
  }

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { state.leftHeld = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight') { state.rightHeld = true; e.preventDefault(); }
    else if ((e.key === ' ' || e.key === 'Enter') && !state.running) { startGame(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') state.leftHeld = false;
    else if (e.key === 'ArrowRight') state.rightHeld = false;
  });

  function bindHold(el, prop) {
    var set = function (v) { return function (e) { e.preventDefault(); state[prop] = v; }; };
    el.addEventListener('pointerdown', set(true));
    el.addEventListener('pointerup', set(false));
    el.addEventListener('pointerleave', set(false));
    el.addEventListener('pointercancel', set(false));
  }
  bindHold(leftBtn, 'leftHeld');
  bindHold(rightBtn, 'rightHeld');

  startBtn.addEventListener('click', startGame);

  draw();
  requestAnimationFrame(tick);
})();
</script>
